services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-TODO_Replace_With_A_Strong_Local_Password_2026!}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BookyDatabase: "Server=sqlserver,1433;Database=BookyServer;User Id=sa;Password=${MSSQL_SA_PASSWORD:-TODO_Replace_With_A_Strong_Local_Password_2026!};Encrypt=True;TrustServerCertificate=True;"
      Cors__AllowedOrigins__0: ${BOOKY_FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${BOOKYSERVER_HTTP_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver_data:
