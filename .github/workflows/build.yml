name: Build API

on:
  push:
    branches: [main, feature/init]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BookyServer.sln
      - name: Build
        run: dotnet build BookyServer.sln --configuration Release --no-restore
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production container image
        run: docker build --tag bookyserver:ci .
